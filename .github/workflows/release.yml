name: Release

# Builds atriumd for each architecture and attaches it to the GitHub release
# for the pushed tag, along with SHA256SUMS. Then opens a pull request that
# points daemon-release.env at the new assets: bin/atriumd-launcher only ever
# downloads what that file pins, so main never names a release that is not
# published yet.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches manifest.json
        run: |
          manifest=$(jq -r .version manifest.json)
          if [[ ${GITHUB_REF_NAME} != "v${manifest}" ]]; then
            echo "::error file=manifest.json::tag ${GITHUB_REF_NAME} does not match manifest.json version ${manifest}; expected v${manifest}"
            exit 1
          fi

  build:
    needs: version
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked --manifest-path daemon/Cargo.toml --target "${{ matrix.target }}"
      # TLS is rustls and certificates come from files, so the binary should
      # need nothing beyond glibc. Fail if a dependency starts linking
      # something else (openssl, dbus), because Arch may not have that version.
      - name: Check linked libraries
        run: |
          bin="daemon/target/${{ matrix.target }}/release/atriumd"
          ldd "$bin"
          unexpected=$(ldd "$bin" | awk '{print $1}' | grep -vE '^(linux-vdso|linux-gate)\.so|^/?.*ld-linux.*\.so|^lib(c|m|gcc_s)\.so' || true)
          if [[ -n $unexpected ]]; then
            echo "::error::atriumd links libraries beyond glibc: $unexpected"
            exit 1
          fi
          echo "glibc required: $(objdump -T "$bin" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)"
      - name: Stage
        run: |
          mkdir dist
          cp "daemon/target/${{ matrix.target }}/release/atriumd" "dist/atriumd-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: atriumd-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: atriumd-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum atriumd-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # A committed pin depends on these exact bytes, so a re-run must never
        # replace them. An existing release without assets is filled in; one
        # that already has any of them fails the job.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            existing=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -E '^(atriumd-|SHA256SUMS$)' || true)
            if [[ -n $existing ]]; then
              echo "::error::release $GITHUB_REF_NAME already has $(echo $existing); refusing to replace assets a pin may depend on"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" dist/*
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  # The pin is computed from the assets as GitHub serves them, not from the
  # build output, and checked through the launcher before the PR is opened.
  # Needs "Allow GitHub Actions to create and approve pull requests" in the
  # repository's Actions settings. A PR opened with GITHUB_TOKEN does not start
  # CI on its own; close and reopen it, or push to its branch, to run CI.
  pin:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # Re-running an older tag's release must not open a PR that moves main
      # back to it.
      - name: Newer than the current pin
        id: newer
        run: |
          current=$(sed -n 's/^ATRIUMD_TAG=//p' daemon-release.env)
          newest=$(printf '%s\n%s\n' "${current#v}" "${GITHUB_REF_NAME#v}" | sort -V | tail -n 1)
          if [[ $GITHUB_REF_NAME == "$current" || $newest != "${GITHUB_REF_NAME#v}" ]]; then
            echo "::notice::main already pins $current; $GITHUB_REF_NAME is not newer, so no pin PR"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          fi
      - name: Download published assets
        if: steps.newer.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir "$RUNNER_TEMP/published"
          gh release download "$GITHUB_REF_NAME" --pattern 'atriumd-*' --dir "$RUNNER_TEMP/published"
      - name: Write daemon-release.env
        if: steps.newer.outputs.skip != 'true'
        run: |
          pinned() {
            local asset="$RUNNER_TEMP/published/atriumd-$1-unknown-linux-gnu" key=$2
            echo "ATRIUMD_${key}_ASSET=atriumd-$1-unknown-linux-gnu"
            echo "ATRIUMD_${key}_SIZE=$(stat -c %s "$asset")"
            echo "ATRIUMD_${key}_SHA256=$(sha256sum "$asset" | cut -d' ' -f1)"
          }
          {
            sed -n '/^#/p' daemon-release.env
            echo "ATRIUMD_TAG=$GITHUB_REF_NAME"
            pinned x86_64 X86_64
            pinned aarch64 AARCH64
          } >"$RUNNER_TEMP/daemon-release.env"
          mv "$RUNNER_TEMP/daemon-release.env" daemon-release.env
          cat daemon-release.env
      - name: Launcher accepts the new pin
        if: steps.newer.outputs.skip != 'true'
        run: XDG_DATA_HOME="$RUNNER_TEMP/data" bin/atriumd-launcher --fetch
      - name: Open the pull request
        if: steps.newer.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- daemon-release.env; then
            echo "daemon-release.env already pins $GITHUB_REF_NAME"
            exit 0
          fi
          branch="pin-atriumd-$GITHUB_REF_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Pin atriumd $GITHUB_REF_NAME"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Pin atriumd $GITHUB_REF_NAME" \
            --body "Points daemon-release.env at the $GITHUB_REF_NAME release assets. Sizes and SHA256s were computed from the published files and checked with bin/atriumd-launcher --fetch. Once merged, installs and updates download $GITHUB_REF_NAME on their next start."
